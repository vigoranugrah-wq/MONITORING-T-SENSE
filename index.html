<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>T-Sense WebGIS Realtime</title>

    <!-- LEAFLET -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        /* HEADER */

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
        }

        /* CONTAINER */

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
        }

        /* CARD */

        .cards {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .judul {
            font-size: 14px;
            color: #666;
        }

        .nilai {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .satuan {
            color: #666;
            margin-top: 5px;
        }

        .online {
            color: green;
        }

        .delayed {
            color: orange;
        }

        .offline {
            color: red;
        }

        /* MAP */

        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* GRAFIK */

        .grafik {
            background: white;
            padding: 20px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .grafik h2 {
            margin-top: 0;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            header h1 {
                font-size: 22px;
            }

            #map {
                height: 400px;
            }

            iframe {
                height: 350px;
            }

        }

    </style>

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header>

    <h1>🌊 T-Sense WebGIS</h1>

    <p>
        Monitoring Pasang Surut Berbasis
        Internet of Things
    </p>

</header>



<div class="container">


    <!-- ============================= -->
    <!-- DATA REALTIME -->
    <!-- ============================= -->

    <div class="cards">


        <!-- JARAK -->

        <div class="card">

            <div class="judul">
                Jarak Sensor
            </div>

            <div
                class="nilai"
                id="jarak">

                -

            </div>

            <div class="satuan">
                cm
            </div>

        </div>



        <!-- WAKTU -->

        <div class="card">

            <div class="judul">
                Waktu Data Terakhir
            </div>

            <div
                class="nilai"
                id="waktu"
                style="font-size:20px;">

                -

            </div>

        </div>



        <!-- UMUR DATA -->

        <div class="card">

            <div class="judul">
                Umur Data
            </div>

            <div
                class="nilai"
                id="umurData">

                -

            </div>

        </div>



        <!-- STATUS -->

        <div class="card">

            <div class="judul">
                Status T-Sense
            </div>

            <div
                class="nilai"
                id="status">

                Menghubungkan...

            </div>

        </div>


    </div>



    <!-- ============================= -->
    <!-- MAP -->
    <!-- ============================= -->

    <div id="map"></div>



    <!-- ============================= -->
    <!-- GRAFIK -->
    <!-- ============================= -->

    <div class="grafik">

        <h2>
            Grafik Data T-Sense
        </h2>

        <iframe
            src="https://thingspeak.com/channels/3097834/charts/6?bgcolor=%23ffffff&color=%23007bff&dynamic=true&results=30">
        </iframe>

    </div>


</div>



<!-- ============================= -->
<!-- LEAFLET JS -->
<!-- ============================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>


// ==========================================
// 1. ELEMENT HTML
// ==========================================

const jarakEl =
    document.getElementById("jarak");

const waktuEl =
    document.getElementById("waktu");

const umurEl =
    document.getElementById("umurData");

const statusEl =
    document.getElementById("status");



// ==========================================
// 2. MEMBUAT PETA
// ==========================================

const map = L.map("map")
    .setView(
        [-2.38, 104.90],
        10
    );



// ==========================================
// 3. OPENSTREETMAP
// ==========================================

const osm = L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {
        attribution:
            "&copy; OpenStreetMap contributors"
    }

).addTo(map);



// ==========================================
// 4. SATELLITE
// ==========================================

const satellite = L.tileLayer(

    "https://server.arcgisonline.com/" +
    "ArcGIS/rest/services/" +
    "World_Imagery/MapServer/tile/{z}/{y}/{x}",

    {
        attribution:
            "Tiles &copy; Esri"
    }

);



// ==========================================
// 5. MARKER T-SENSE
// ==========================================

const tsense = L.marker(

    [-2.38, 104.90]

).addTo(map);



// Popup awal

tsense.bindPopup(

    "<b>🌊 T-Sense</b><br>" +
    "Stasiun Monitoring<br>" +
    "Muara Sungsang<br><br>" +
    "Jarak Sensor: " +
    "<span id='popupData'>-</span> cm"

);



// ==========================================
// 6. LAYER CONTROL
// ==========================================

const baseMaps = {

    "OpenStreetMap": osm,

    "Satellite": satellite

};

L.control.layers(
    baseMaps
).addTo(map);



// ==========================================
// 7. THINGSPEAK
// ==========================================

const channelID = "3097834";



// ==========================================
// 8. AMBIL DATA TERBARU
// ==========================================

function ambilData() {

    const url =
        "https://api.thingspeak.com/" +
        "channels/" +
        channelID +
        "/feeds.json?results=1";


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "ThingSpeak HTTP " +
                    response.status
                );

            }

            return response.json();

        })


        .then(data => {


            // ==================================
            // CEK DATA
            // ==================================

            if (
                !data.feeds ||
                data.feeds.length === 0
            ) {

                statusEl.innerText =
                    "NO DATA";

                statusEl.className =
                    "nilai offline";

                return;

            }


            // ==================================
            // DATA TERBARU
            // ==================================

            const terbaru =
                data.feeds[0];


            const nilai =
                terbaru.field6;


            const waktu =
                terbaru.created_at;



            // ==================================
            // TAMPILKAN NILAI FIELD 6
            // ==================================

            if (
                nilai !== null &&
                nilai !== undefined &&
                nilai !== ""
            ) {

                const angka =
                    parseFloat(nilai);


                if (!isNaN(angka)) {

                    jarakEl.innerText =
                        angka.toFixed(2);


                    // Update popup jika ada

                    const popupEl =
                        document.getElementById(
                            "popupData"
                        );


                    if (popupEl) {

                        popupEl.innerText =
                            angka.toFixed(2);

                    }

                }

            }



            // ==================================
            // WAKTU INDONESIA
            // ==================================

            const waktuDate =
                new Date(waktu);


            const waktuIndonesia =
                waktuDate.toLocaleString(
                    "id-ID",
                    {
                        timeZone:
                            "Asia/Jakarta"
                    }
                );


            waktuEl.innerText =
                waktuIndonesia;



            // ==================================
            // HITUNG UMUR DATA
            // ==================================

            const sekarang =
                new Date();


            const selisihMs =
                sekarang - waktuDate;


            const selisihMenit =
                Math.floor(
                    selisihMs /
                    (1000 * 60)
                );


            if (
                selisihMenit < 60
            ) {

                umurEl.innerText =
                    selisihMenit +
                    " menit";

            }
            else {

                const jam =
                    Math.floor(
                        selisihMenit / 60
                    );

                const menit =
                    selisihMenit % 60;


                umurEl.innerText =
                    jam +
                    " jam " +
                    menit +
                    " menit";

            }



            // ==================================
            // STATUS
            //
            // Karena upload sekitar 1 jam sekali:
            //
            // <= 70 menit  = ONLINE
            // <= 120 menit = DELAYED
            // > 120 menit = DATA LAMA
            // ==================================

            if (
                selisihMenit <= 70
            ) {

                statusEl.innerText =
                    "ONLINE";

                statusEl.className =
                    "nilai online";

            }

            else if (
                selisihMenit <= 120
            ) {

                statusEl.innerText =
                    "DELAYED";

                statusEl.className =
                    "nilai delayed";

            }

            else {

                statusEl.innerText =
                    "DATA LAMA";

                statusEl.className =
                    "nilai offline";

            }



            // ==================================
            // CONSOLE
            // ==================================

            console.log(
                "Data T-Sense:",
                terbaru
            );

        })


        // ==================================
        // JIKA API ERROR
        // ==================================

        .catch(error => {

            console.error(
                "Error ThingSpeak:",
                error
            );


            statusEl.innerText =
                "OFFLINE";


            statusEl.className =
                "nilai offline";

        });

}



// ==========================================
// 9. JALANKAN SAAT WEBSITE DIBUKA
// ==========================================

ambilData();



// ==========================================
// 10. CEK SETIAP 15 DETIK
// ==========================================

setInterval(
    ambilData,
    15000
);


</script>


</body>

</html>
